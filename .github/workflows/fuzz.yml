name: Fuzz

# Millions of generated cases, in parallel shards, each with a seed of its own. They cover:
# - the verifier (honest transactions, attacks, Token-2022, the tolerance rule);
# - the page's swap at any tolerance;
# - agents and bots end to end, against honest and lying servers, with any tolerance and price impact;
# - the small functions every channel leans on;
# - the edges: any amount, decimals, quote and balance, and any price the market may give;
# - any change to an honest transaction, bytes or instructions, several at once;
# - the owner's limits for agents and bots, the 20% floor, and a bot that edits prepare's answer.
# About 27,300,000 cases a run.
#
# By hand only (Actions, Fuzz, Run workflow), before a release: a run is some 600 billed minutes, a
# third of a private repository's free month (final audit, H3). CI runs the same properties at their
# normal size on every change to the code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: verifier-honest
            shard: 1
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 2
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 3
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 4
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 5
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 6
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 7
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-honest
            shard: 8
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every honest shape'
            proves: "every honest transaction the compiler builds passes"
          - suite: verifier-attacks
            shard: 1
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 2
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 3
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 4
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 5
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 6
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 7
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-attacks
            shard: 8
            of: 8
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'every attack'
            proves: "every attack on the transaction is refused"
          - suite: verifier-token2022
            shard: 1
            of: 4
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'extension we refuse'
            proves: "a Token-2022 mint with a refused extension never passes"
          - suite: verifier-token2022
            shard: 2
            of: 4
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'extension we refuse'
            proves: "a Token-2022 mint with a refused extension never passes"
          - suite: verifier-token2022
            shard: 3
            of: 4
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'extension we refuse'
            proves: "a Token-2022 mint with a refused extension never passes"
          - suite: verifier-token2022
            shard: 4
            of: 4
            file: packages/verifier/test/property.test.ts
            runs: 100000
            filter: 'extension we refuse'
            proves: "a Token-2022 mint with a refused extension never passes"
          - suite: token2022-matrix
            shard: 1
            of: 1
            file: packages/verifier/test/extensions.test.ts
            runs: 2000000
            proves: "the Token-2022 extension matrix"
          - suite: tolerance-rule
            shard: 1
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 2
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 3
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 4
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 5
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 6
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 7
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: tolerance-rule
            shard: 8
            of: 8
            file: packages/verifier/test/slippage.property.test.ts
            runs: 150000
            proves: "a route is refused exactly when above the tolerance or below the minimum"
          - suite: page-swap
            shard: 1
            of: 4
            file: packages/jupiter/test/slippage.property.test.ts
            runs: 25000
            proves: "the page's swap certifies at the tolerance in force"
          - suite: page-swap
            shard: 2
            of: 4
            file: packages/jupiter/test/slippage.property.test.ts
            runs: 25000
            proves: "the page's swap certifies at the tolerance in force"
          - suite: page-swap
            shard: 3
            of: 4
            file: packages/jupiter/test/slippage.property.test.ts
            runs: 25000
            proves: "the page's swap certifies at the tolerance in force"
          - suite: page-swap
            shard: 4
            of: 4
            file: packages/jupiter/test/slippage.property.test.ts
            runs: 25000
            proves: "the page's swap certifies at the tolerance in force"
          - suite: agents-and-bots
            shard: 1
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 2
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 3
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 4
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 5
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 6
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 7
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: agents-and-bots
            shard: 8
            of: 8
            file: apps/web/test/agents.property.test.ts
            runs: 12500
            proves: "agents and bots swap exactly when honest, valid and within limits"
          - suite: small-functions
            shard: 1
            of: 2
            file: apps/web/test/pure.property.test.ts
            runs: 1000000
            proves: "slippage input and storage, key message and seal, what arrived"
          - suite: small-functions
            shard: 2
            of: 2
            file: apps/web/test/pure.property.test.ts
            runs: 1000000
            proves: "slippage input and storage, key message and seal, what arrived"
          - suite: edges
            shard: 1
            of: 4
            file: packages/verifier/test/extremes.property.test.ts
            runs: 200000
            proves: "fees, minimums and the verifier at any amount, decimals, quote and balance"
          - suite: edges
            shard: 2
            of: 4
            file: packages/verifier/test/extremes.property.test.ts
            runs: 200000
            proves: "fees, minimums and the verifier at any amount, decimals, quote and balance"
          - suite: edges
            shard: 3
            of: 4
            file: packages/verifier/test/extremes.property.test.ts
            runs: 200000
            proves: "fees, minimums and the verifier at any amount, decimals, quote and balance"
          - suite: edges
            shard: 4
            of: 4
            file: packages/verifier/test/extremes.property.test.ts
            runs: 200000
            proves: "fees, minimums and the verifier at any amount, decimals, quote and balance"
          - suite: mutations
            shard: 1
            of: 4
            file: packages/verifier/test/mutation.property.test.ts
            runs: 100000
            proves: "any change to an honest transaction: a verdict every time, nothing harmful accepted"
          - suite: mutations
            shard: 2
            of: 4
            file: packages/verifier/test/mutation.property.test.ts
            runs: 100000
            proves: "any change to an honest transaction: a verdict every time, nothing harmful accepted"
          - suite: mutations
            shard: 3
            of: 4
            file: packages/verifier/test/mutation.property.test.ts
            runs: 100000
            proves: "any change to an honest transaction: a verdict every time, nothing harmful accepted"
          - suite: mutations
            shard: 4
            of: 4
            file: packages/verifier/test/mutation.property.test.ts
            runs: 100000
            proves: "any change to an honest transaction: a verdict every time, nothing harmful accepted"
          - suite: page-price
            shard: 1
            of: 4
            file: packages/jupiter/test/price.property.test.ts
            runs: 50000
            proves: "the page's swap at any price: the right minimum and fee, or a reason of its own"
          - suite: page-price
            shard: 2
            of: 4
            file: packages/jupiter/test/price.property.test.ts
            runs: 50000
            proves: "the page's swap at any price: the right minimum and fee, or a reason of its own"
          - suite: page-price
            shard: 3
            of: 4
            file: packages/jupiter/test/price.property.test.ts
            runs: 50000
            proves: "the page's swap at any price: the right minimum and fee, or a reason of its own"
          - suite: page-price
            shard: 4
            of: 4
            file: packages/jupiter/test/price.property.test.ts
            runs: 50000
            proves: "the page's swap at any price: the right minimum and fee, or a reason of its own"
          - suite: agents-limits
            shard: 1
            of: 4
            file: apps/web/test/agents.limits.property.test.ts
            runs: 5000
            proves: "agents and bots alike at any price; the 20% floor; the owner's limits at prepare and finalize; an edited answer sends nothing"
          - suite: agents-limits
            shard: 2
            of: 4
            file: apps/web/test/agents.limits.property.test.ts
            runs: 5000
            proves: "agents and bots alike at any price; the 20% floor; the owner's limits at prepare and finalize; an edited answer sends nothing"
          - suite: agents-limits
            shard: 3
            of: 4
            file: apps/web/test/agents.limits.property.test.ts
            runs: 5000
            proves: "agents and bots alike at any price; the 20% floor; the owner's limits at prepare and finalize; an edited answer sends nothing"
          - suite: agents-limits
            shard: 4
            of: 4
            file: apps/web/test/agents.limits.property.test.ts
            runs: 5000
            proves: "agents and bots alike at any price; the 20% floor; the owner's limits at prepare and finalize; an edited answer sends nothing"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fuzz
        env:
          ORIENTIM_FUZZ_RUNS: ${{ matrix.runs }}
          SHARD: ${{ matrix.shard }}
          FILE: ${{ matrix.file }}
          FILTER: ${{ matrix.filter }}
        run: |
          # One seed per run and shard, printed so that any failure can be replayed exactly.
          export ORIENTIM_FUZZ_SEED=$(( GITHUB_RUN_NUMBER * 1000 + SHARD ))
          echo "seed $ORIENTIM_FUZZ_SEED, $ORIENTIM_FUZZ_RUNS cases, $FILE ${FILTER:+(\"$FILTER\")}"
          started=$(date +%s)
          vitest="$GITHUB_WORKSPACE/node_modules/vitest/vitest.mjs"
          set +e
          if [ -n "$FILTER" ]; then node "$vitest" run "$FILE" --mode fuzz -t "$FILTER"; else node "$vitest" run "$FILE" --mode fuzz; fi
          status=$?
          set -e
          took=$(( $(date +%s) - started ))
          result=$([ $status -eq 0 ] && echo "passed" || echo "FAILED")
          {
            echo "### ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.of }}: $result"
            echo ""
            echo "- proves: ${{ matrix.proves }}"
            echo "- cases: $ORIENTIM_FUZZ_RUNS per property, seed $ORIENTIM_FUZZ_SEED"
            echo "- time: $(( took / 60 )) min $(( took % 60 )) s"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
