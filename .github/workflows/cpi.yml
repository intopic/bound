name: CPI

# T6: build the malicious swap program and run it against Bound's protected transaction inside a
# real Solana VM. Separate from CI because it needs the Rust and Solana toolchains.
on:
  push:
    paths:
      - 'tests/cpi/**'
      - 'packages/core/**'
      - 'packages/verifier/**'
      - '.github/workflows/cpi.yml'
  workflow_dispatch:

jobs:
  cpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The lockfile is written on Windows, where litesvm has no binary; make sure the Linux one is here.
      - run: npm install --no-save litesvm@1.4.1

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: solana --version

      - name: Cache the SBF platform tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ runner.os }}

      - name: Build the malicious program
        working-directory: tests/cpi/attacker
        run: cargo build-sbf

      - name: Run T6
        run: node tests/cpi/run.ts

      - name: The report
        if: always()
        run: cat tests/cpi/results/cpi.md || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpi-report
          path: tests/cpi/results/cpi.md
          if-no-files-found: ignore
