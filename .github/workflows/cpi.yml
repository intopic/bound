name: CPI

# T6: build the malicious swap program and run it against Orientim's protected transaction inside a
# real Solana VM. Separate from CI because it needs the Rust and Solana toolchains.
on:
  # Every push to main, whatever it touched (review FA-10): the guarantee is tested on each change
  # that can reach production. Other branches, only when what T6 exercises changes.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tests/cpi/**'
      - 'packages/core/**'
      - 'packages/verifier/**'
      - '.github/workflows/cpi.yml'
  workflow_dispatch:

jobs:
  cpi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The lockfile is written on Windows, where litesvm has no binary; make sure the Linux one is here.
      - run: npm install --no-save litesvm@1.4.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 23 September 2026
      - name: Install the Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: solana --version

      - name: Cache the SBF platform tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/solana
          key: platform-tools-${{ runner.os }}

      - name: Build the malicious program
        working-directory: tests/cpi/attacker
        run: cargo build-sbf

      - name: Run T6
        run: node tests/cpi/run.ts

      - name: The report
        if: always()
        run: cat tests/cpi/results/cpi.md || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpi-report
          path: tests/cpi/results/cpi.md
          if-no-files-found: ignore
