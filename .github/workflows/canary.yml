name: Canary

# Does a protected swap still build and execute? tools/canary.ts builds seven swaps on mainnet state,
# each with its fee where it belongs, one as v1, and Pump.fun buys on both markets (nothing is signed
# or sent). It fails when Jupiter's format, a Pump.fun program or a token program changed under
# Bound, or a fee is no longer taken where it should be (research audit F-07, engineering review
# M-09), and exits 2 when nothing could be checked. A failed run makes GitHub tell the owner of this
# workflow. Off until the repository variable BOUND_CANARY is set to 1.
on:
  schedule:
    # Every three hours. Each run is about two billed minutes: some 480 minutes a month, which fits a
    # private repository's free plan (2,000) beside CI, where every 30 minutes (2,900) did not (final
    # audit, H3). Set the repository variable BOUND_CANARY to 1 to turn it on; run it by hand after
    # anything changes under Bound (a Solana upgrade such as Alpenglow, a Jupiter or Pump.fun release).
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    if: vars.BOUND_CANARY == '1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A paid RPC and a Jupiter key make it steadier; without them the public ones are used.
      - run: node tools/canary.ts
        env:
          RPC_URL: ${{ secrets.CANARY_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.CANARY_JUPITER_API_KEY }}
