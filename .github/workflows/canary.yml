name: Canary

# Does a protected swap still build and execute? tools/canary.ts builds seven swaps on mainnet state,
# each with its fee where it belongs, one as v1, and Pump.fun buys on both markets (nothing is signed
# or sent). It fails when Jupiter's format, a Pump.fun program or a token program changed under
# Orientim, or a fee is no longer taken where it should be, and exits 2 when anything could not be
# proven this run (a market that answered 429, say): incomplete is not a pass. A failed run makes
# GitHub notify the maintainers of this workflow. On by default; the repository variable
# ORIENTIM_CANARY set to 0 turns the schedule off.
on:
  schedule:
    # Every six hours (free on a public repository). Run it by hand after anything changes under
    # Orientim (a Solana upgrade such as Alpenglow, a Jupiter or Pump.fun release).
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    if: (vars.ORIENTIM_CANARY || 'on') != '0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A paid RPC and a Jupiter key make it steadier; without them the public ones are used.
      - run: node tools/canary.ts
        env:
          RPC_URL: ${{ secrets.CANARY_RPC_URL }}
          JUPITER_API_KEY: ${{ secrets.CANARY_JUPITER_API_KEY }}
