name: Upstream review

# When the canary fails because Jupiter, the Pump.fun curve or PumpSwap was deployed again, the
# review it asks for, on mainnet state: Jupiter's own floor and the arguments the verifier reads
# (tests/integration/jupiter-floor.ts), then the canary's swaps once more, every market proven (a run
# with a market it could not prove, a 429 say, is asked again up to three times). When both pass,
# the run's summary gives the deploys to record in tools/known-deploys.json
# (node tools/canary.ts --record-deploys). Nothing is signed or sent. By hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RPC_URL: ${{ secrets.CANARY_RPC_URL }}
      JUPITER_API_KEY: ${{ secrets.CANARY_JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Jupiter's own floor, and the arguments the verifier reads
        run: node tests/integration/jupiter-floor.ts
      - name: The canary's swaps, every market proven
        run: |
          for attempt in 1 2 3; do
            # The review is of the swaps: the deploys themselves are what is being reviewed.
            if node tools/canary.ts --swaps-only; then exit 0; fi
            echo "Attempt $attempt did not prove every market; asking again in 60 s."
            sleep 60
          done
          exit 1
      - name: The deploys to record
        run: |
          node tools/canary.ts --record-deploys
          {
            echo '## Reviewed: record these deploys in tools/known-deploys.json'
            echo '```json'
            cat tools/known-deploys.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
