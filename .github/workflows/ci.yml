name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The agent skill ships a bundle of the verifier; it must be exactly what the source builds.
      - run: node tools/build-skill.ts --check
      - run: npm run build

  plugin:
    # The Solana Agent Kit plugin (integrations/solana-agent-kit): its own dependencies, the
    # repository's tools. Built, tested, packed, then installed and loaded the way a project that uses
    # it would, with import and with require (independent audit, ORI-09).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/solana-agent-kit/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: integrations/solana-agent-kit
      - run: npm run typecheck
        working-directory: integrations/solana-agent-kit
      - run: npm test
        working-directory: integrations/solana-agent-kit
      - name: Pack, install as a project would, load both ways
        working-directory: integrations/solana-agent-kit
        run: |
          tgz="$RUNNER_TEMP/$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tgz" solana-agent-kit@2.0.10 @solana/web3.js@1.99.0 zod@3.25.76
          node --input-type=module -e "import P, { createOrientimPlugin } from '@orientim/plugin-solana-agent-kit'; if (P.actions[0].name !== 'ORIENTIM_PROTECTED_SWAP' || typeof createOrientimPlugin !== 'function') process.exit(1);"
          node -e "const m = require('@orientim/plugin-solana-agent-kit'); if (m.default.name !== 'orientim' || m.toBaseUnits(0.5, 9) !== 500000000n) process.exit(1);"

  reproducible:
    # The digest of the built client assets is what a user can check against the audited source,
    # and it is worth nothing unless the same source always produces the same bytes.
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.twice.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build twice and compare
        id: twice
        run: |
          ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          first=$(node tools/build-digest.ts)
          rm -rf apps/web/.next
          ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          second=$(node tools/build-digest.ts)
          echo "first  $first"
          echo "second $second"
          test "$first" = "$second"
          echo "digest=$first" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$first" >> "$GITHUB_OUTPUT"

  reproducible-elsewhere:
    # The same build on another runner image must give the same digest (review FA-10): two builds
    # on one machine agree even when that machine is what changed them.
    needs: reproducible
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build once and compare with the other image
        run: |
          ORIENTIM_BUILD_ID=$GITHUB_SHA npm run build
          here=$(node tools/build-digest.ts)
          echo "ubuntu-latest ${{ needs.reproducible.outputs.digest }}"
          echo "ubuntu-22.04  $here"
          test "$here" = "${{ needs.reproducible.outputs.digest }}"
